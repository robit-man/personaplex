# PersonaPlex synthesis makes its admission decision from live /proc/meminfo:
# all host memory consumers count, generation pauses at the configured 80% and
# resumes at 75%.  The distro user-manager default instead kills arbitrary
# child units once a PSI threshold is crossed, even with substantial available
# memory.  Do not register this user manager as a systemd-oomd pressure kill
# target; retain cgroup MemoryHigh/MemoryMax as the late safety net.
[Service]
ManagedOOMMemoryPressure=auto
